<script>
        const dom = {
            secciones: document.querySelectorAll('.seccion-contenido'),
            navPills: document.querySelectorAll('.nav-pill'),
            mobileMenu: document.getElementById('mobile-menu'),
            topImg: document.getElementById('top-carousel-img'),
            mainImg: document.getElementById('main-carousel-img'),
            dots: document.querySelectorAll('.carousel-dot')
        };

        function mostrarSeccion(idSeccion) {
            dom.secciones.forEach(sec => sec.classList.add('hidden'));

            const seccionActiva = document.getElementById(idSeccion);
            if (seccionActiva) seccionActiva.classList.remove('hidden');

            dom.navPills.forEach(btn => btn.classList.remove('active'));

            const btnDesktop = document.getElementById(`btn-${idSeccion}`);
            const btnMobile = document.getElementById(`btn-mb-${idSeccion}`);
            if (btnDesktop) btnDesktop.classList.add('active');
            if (btnMobile) btnMobile.classList.add('active');

            if (dom.mobileMenu && !dom.mobileMenu.classList.contains('hidden')) {
                dom.mobileMenu.classList.add('hidden');
            }

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        const numeroTelefonoEmpresa = "5491138835229";

        function abrirWhatsapp(texto) {
            window.open(`https://api.whatsapp.com/send?phone=${numeroTelefonoEmpresa}&text=${encodeURIComponent(texto)}`, '_blank');
        }

        // Definimos la carpeta y cambiamos la extensión a .png
        const imageFolder = "FOTOSH/";
        const imageBaseNames = ["01", "02", "03", "04"];
        let currentIndex = 0;
        let carouselTimer = null;

        function getSafeImagePath(name) {
            return `${imageFolder}${name}.png`;
        }

        function updateCarouselImages() {
            if (!dom.topImg || !dom.mainImg) return;

            dom.topImg.style.opacity = '0';
            dom.mainImg.style.opacity = '0';

            setTimeout(() => {
                const topName = imageBaseNames[(currentIndex + 1) % imageBaseNames.length];
                const mainName = imageBaseNames[currentIndex];

                dom.topImg.src = getSafeImagePath(topName);
                dom.mainImg.src = getSafeImagePath(mainName);

                dom.topImg.style.opacity = '1';
                dom.mainImg.style.opacity = '1';
            }, 200);

            dom.dots.forEach((dot, idx) => {
                dot.classList.toggle('w-5', idx === currentIndex);
                dot.classList.toggle('sm:w-6', idx === currentIndex);
                dot.classList.toggle('w-2', idx !== currentIndex);
                dot.classList.toggle('sm:w-2.5', idx !== currentIndex);
                dot.classList.toggle('bg-white', idx === currentIndex);
                dot.classList.toggle('bg-white/40', idx !== currentIndex);
            });
        }

        function nextSlide() {
            currentIndex = (currentIndex + 1) % imageBaseNames.length;
            updateCarouselImages();
        }

        function setSlide(index) {
            currentIndex = index;
            updateCarouselImages();
            resetTimer();
        }

        function startTimer() {
            if (carouselTimer) clearInterval(carouselTimer);
            carouselTimer = setInterval(nextSlide, 4500);
        }

        function resetTimer() {
            if (carouselTimer) clearInterval(carouselTimer);
            startTimer();
        }

        // Protección adicional por si alguna usa .PNG en mayúscula
        document.addEventListener("error", function (e) {
            if (e.target.tagName === "IMG") {
                let currentSrc = e.target.src;
                if (currentSrc.includes(".png") && !currentSrc.includes(".PNG")) {
                    e.target.src = currentSrc.replace(".png", ".PNG");
                }
            }
        }, true);

        document.getElementById('mobile-menu-btn')?.addEventListener('click', () => {
            dom.mobileMenu?.classList.toggle('hidden');
        });

        window.addEventListener('DOMContentLoaded', () => {
            updateCarouselImages();
            startTimer();
        });
    </script>
